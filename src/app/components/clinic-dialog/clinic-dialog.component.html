<div class="overlay" *ngIf="mode" (click)="closed.emit()"></div>
<section class="dialog" *ngIf="mode">
  <div class="head">
    <div><p>{{mode === 'patient' ? 'EXPEDIENTE ADMINISTRATIVO' : 'AGENDA CLÍNICA'}}</p><h2>{{mode === 'patient' ? 'Registrar paciente' : 'Agendar nueva cita'}}</h2></div>
    <button type="button" (click)="closed.emit()">×</button>
  </div>

  <form *ngIf="mode === 'patient'" (ngSubmit)="submitPatient()">
    <div class="grid">
      <label><span>Nombre(s) *</span><input name="first_name" [(ngModel)]="patient.first_name" /></label>
      <label><span>Apellidos *</span><input name="last_name" [(ngModel)]="patient.last_name" /></label>
      <label><span>Fecha de nacimiento *</span><input type="date" name="birth_date" [(ngModel)]="patient.birth_date" /></label>
      <label><span>Sexo</span><select name="sex" [(ngModel)]="patient.sex"><option value="not_specified">No especificado</option><option value="female">Femenino</option><option value="male">Masculino</option><option value="other">Otro</option></select></label>
      <label><span>Teléfono</span><input name="phone" [(ngModel)]="patient.phone" /></label>
      <label><span>Correo electrónico</span><input type="email" name="email" [(ngModel)]="patient.email" /></label>
      <label><span>Tipo de sangre</span><select name="blood_type" [(ngModel)]="patient.blood_type"><option value="">Sin registrar</option><option *ngFor="let type of ['A+','A-','B+','B-','AB+','AB-','O+','O-']">{{type}}</option></select></label>
      <label><span>Contacto de emergencia</span><input name="emergency_name" [(ngModel)]="patient.emergency_contact_name" /></label>
      <label><span>Teléfono de emergencia</span><input name="emergency_phone" [(ngModel)]="patient.emergency_contact_phone" /></label>
      <label class="wide"><span>Domicilio</span><input name="address" [(ngModel)]="patient.address" /></label>
    </div>
    <p class="error" *ngIf="error()">{{error()}}</p>
    <div class="actions"><button type="button" class="cancel" (click)="closed.emit()">Cancelar</button><button class="save" [disabled]="busy()">{{busy() ? 'Guardando…' : 'Registrar paciente'}}</button></div>
  </form>

  <form *ngIf="mode === 'appointment'" (ngSubmit)="submitAppointment()">
    <div class="grid">
      <label class="wide"><span>Paciente *</span><select name="patient_id" [(ngModel)]="appointment.patient_id"><option value="">Seleccionar paciente</option><option *ngFor="let p of patients" [value]="p.id">{{p.last_name}}, {{p.first_name}} · #{{p.record_number}}</option></select></label>
      <label><span>Fecha *</span><input type="date" name="date" [(ngModel)]="appointment.date" /></label>
      <label><span>Hora *</span><input type="time" name="time" [(ngModel)]="appointment.time" /></label>
      <label><span>Tipo de consulta</span><select name="type" [(ngModel)]="appointment.appointment_type"><option value="general">Consulta general</option><option value="diabetes">Control de diabetes</option><option value="prenatal">Control prenatal</option><option value="results">Resultados</option><option value="other">Otro</option></select></label>
      <label><span>Estado</span><select name="status" [(ngModel)]="appointment.status"><option value="scheduled">Programada</option><option value="confirmed">Confirmada</option><option value="waiting">En espera</option></select></label>
      <label class="wide"><span>Motivo</span><input name="reason" [(ngModel)]="appointment.reason" placeholder="Motivo principal de la cita" /></label>
      <label class="wide"><span>Notas administrativas</span><textarea name="notes" [(ngModel)]="appointment.administrative_notes"></textarea></label>
    </div>
    <p class="error" *ngIf="error()">{{error()}}</p>
    <div class="actions"><button type="button" class="cancel" (click)="closed.emit()">Cancelar</button><button class="save" [disabled]="busy()">{{busy() ? 'Guardando…' : 'Agendar cita'}}</button></div>
  </form>
</section>
